[project]
name = "vextrus-cad"
version = "0.0.0"
description = "DXF/DWG ingestion: drawing in, EntityGraph JSON out. A CLI pipeline, never a resident service (ADR-0001)."
requires-python = ">=3.13"
dependencies = [
    "ezdxf>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vextrus_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
