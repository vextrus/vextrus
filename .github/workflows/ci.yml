# CI — the missing trigger (.wayfinder/harness/tickets/13-ci-the-missing-trigger.md).
#
# This workflow holds NO project knowledge, on purpose. No setup recipe, no Node
# version, no Postgres service block, no stage list, no path filter. It runs the
# provisioner and the drill, and nothing else — because `provision.sh`'s last act
# is `parity.sh`, checkout-and-provision *is* checkup -> verify -> test:db -> a
# `next dev` boot probed for 200. A stage added to verify tomorrow is picked up
# with no change here.
#
# The rejected alternative was the conventional one: actions/setup-node plus a
# postgres:16 service block. That is a *second provisioner* — two recipes for one
# machine, drifting apart, each proving something about itself — and that
# divergence is what the harness effort exists to kill. If `provision.sh` cannot
# stand up a hosted runner, that is a provisioner defect, and here is where it
# should be found.
name: ci

on:
  # The gate. This run is the one that becomes a required status check with
  # "require branches to be up to date before merging", which makes both halves
  # of ADR-0010 mechanical: the tree that was tested is the tree that lands.
  pull_request:
    branches: [main]
  # A canary, never a gate — by the time it fires there is nothing left to
  # block. Its job is to make "is main broken, or is it me?" a lookup instead of
  # an investigation, and to give the build stage a queryable series so
  # "re-measure, not relax" has a history rather than a threshold.
  push:
    branches: [main]
  workflow_dispatch:

# No `schedule`: nothing consumes a 3am result, and an unread red is worse than
# no signal.

# Not a timing budget (ticket 13 rules none, ticket 12 rules wall-clock a
# consequence with no target). Superseded runs on the same ref are wasted work,
# and a job cancelled by a newer push never reports a red nobody caused.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This job reads a checkout and reports a status; it writes nothing. The default
# token permission set is the repository's, which can be read/write — a checked
# workflow that runs `provision.sh` (which downloads Node, installs packages, and
# runs the repo's own scripts) has no business holding a write credential it does
# not use. Stated here rather than assumed from a repository setting, so the
# grant travels with the workflow.
permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    # A hang net in ticket 09's sense, not a latency assertion: the expected run
    # is 2-4 minutes, and this is an order of magnitude clear of it. Nothing
    # gates on how long a stage takes.
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 is load-bearing. Actions shallow-clones by default and
      # fetches only the ref under test; db:replay's baseline is
      # `merge-base(HEAD, origin/main)`, so without full history there is either
      # no `origin/main` to resolve or no common ancestor to find, and the drill
      # refuses (exit 2) rather than guessing a baseline.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The whole gate. provision.sh ends in parity.sh, which runs the legs on a
      # session's PATH and fails fast; its exit code is the contract.
      - run: bash scripts/provision.sh

      # The drill (ticket 10), called blindly and unconditionally — the skip
      # lives in the script, because a path filter here would be project
      # knowledge in the one place this repo keeps free of it.
      #
      # Held from birth until ticket 17, and the hold is *discharged rather than
      # triggered*: the debt was never the two lines of YAML, it was that the
      # drill's unit made this step meaningless on a PR. Its baseline was the
      # parent of the commit that added the repo's newest migration, so every
      # committed tree replayed the last landed group — red on every commit
      # while 0010 stands unrepaired, and after the next migration lands, green
      # on every commit forever, re-proving a migration nobody touched.
      #
      # The unit is now the change: `merge-base(HEAD, origin/main)`, so this
      # step asks exactly one question — do the migrations *this PR adds*
      # survive main's rows — and answers "nothing to replay", exit 0, on the
      # commits that add none. On the push-to-main canary HEAD *is* the base
      # ref, so it always skips: that question was answered on the PR, and
      # asking it again after the merge is the forever-green this replaced.
      #
      # Never done instead: pinning REPLAY_BASELINE past 0010, which is rigging
      # a check to pass. 0010's finding is not amnestied by any of this — it
      # stands recorded in ticket 10, and the drill now says whose a failing
      # migration is instead of emitting a stack trace.
      - run: pnpm db:replay
